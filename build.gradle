plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group 'com.townyelections'
version '1.0.0'

repositories {
    mavenCentral()
}

// NO dependencies - everything is loaded via reflection at runtime
// Geyser provides its API on the extension classpath
// Bukkit is provided by the server
// TownyElections and Towny are loaded via reflection

shadowJar {
    archiveFileName = "TownyElections-geyser-${version}.jar"
    
    // Exclude unnecessary files
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}
