plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group 'com.townyelections'
version '1.0.0'

repositories {
    mavenCentral()
    maven { url 'https://repo.opencollab.dev/main/' }
}

dependencies {
    // Geyser API - needed for compilation
    compileOnly 'org.geysermc.geyser:api:2.10.0-SNAPSHOT'
    
    // Bukkit API - needed for compilation
    compileOnly 'org.bukkit:bukkit:1.21.4-R0.1-SNAPSHOT'
}

shadowJar {
    archiveFileName = "TownyElections-geyser-${version}.jar"
    
    // Exclude unnecessary files
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}
