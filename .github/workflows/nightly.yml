name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'  # Run at midnight UTC every day
  workflow_dispatch:  # Allow manual triggering

jobs:
  nightly:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2
    
    - name: Build with Gradle
      run: ./gradlew build shadowJar
        
    - name: Create nightly artifact name
      id: nightly
      run: |
        DATE=$(date +%Y%m%d)
        COMMIT=$(git rev-parse --short HEAD)
        echo "filename=TownyElections-geyser-nightly-${DATE}-${COMMIT}.jar" >> $GITHUB_OUTPUT
        
    - name: Upload nightly artifact
      uses: actions/upload-artifact@v4
      with:
        name: TownyElections-geyser-nightly
        path: build/libs/*.jar
        retention-days: 30
        
    - name: Create GitHub Release (Nightly)
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        name: Nightly Build - ${{ steps.nightly.outputs.filename }}
        tag_name: nightly-${{ steps.nightly.outputs.filename }}
        files: build/libs/*.jar
        prerelease: true
        generate_release_notes: false
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
